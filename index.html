<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>

<HEAD>
  <TITLE>Heart</TITLE>
  <META NAME="Generator" CONTENT="EditPlus">
  <META NAME="Author" CONTENT="">
  <META NAME="Keywords" CONTENT="">
  <META NAME="Description" CONTENT="">
  <link rel="icon" type="image/png" sizes="32x32" href="mylove-circle.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
      background: rgb(13, 14, 16);
      overflow: hidden;
      color: white;
      font-family: "Poppins", sans-serif;
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    /* --- ẢNH Ở GIỮA TRÁI TIM --- */
    .center-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      z-index: 10;
      box-shadow: 0 0 20px #ff80b0, 0 0 40px #ffb6c1;
      animation: pulse 2s infinite;
      pointer-events: none;
    }

    select {
      background: transparent;
      border: 1px solid rgba(255, 182, 193, 0.6);
      border-radius: 10px;
      color: #ffb6c1; /* 💖 Màu hồng pastel cho chữ */
      padding: 5px 10px;
      outline: none;
      font-size: 14px;
      text-align: center;
      appearance: none;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.3);
    }

    select option {
      background: #1a1a1a; /* 🌑 Nền tối giúp chữ rõ khi mở dropdown */
      color: #ffb6c1; /* 💗 Màu hồng cùng tông */
    }
    .pink-loop {
      color: #ffb6c1; /* 💖 Màu hồng pastel */
      font-size: 20px;
    }


    @keyframes pulse {
      0% {
        box-shadow: 0 0 20px #ff80b0, 0 0 40px #ffb6c1;
      }

      50% {
        box-shadow: 0 0 40px #ff80b0, 0 0 80px #ffc0cb;
      }

      100% {
        box-shadow: 0 0 20px #ff80b0, 0 0 40px #ffb6c1;
      }
    }

    /* --- TRÌNH PHÁT NHẠC MINI --- */
    .music-player {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 15px 25px;
      box-shadow: 0 0 20px #ffb6c1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 320px;
      z-index: 20;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      margin-top: 10px;
    }


    .control-btn {
      background: none;
      border: none;
      color: #ffb6c1; /* 💖 Màu hồng pastel đồng bộ */
      font-size: 28px; /* Tăng size nếu muốn */
      cursor: pointer;
      transition: 0.3s;
      outline: none;
    }

    .control-btn:hover {
      transform: scale(1.3);
      color: #ffc0cb; /* hover nhạt hơn */
    }

    .progress {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff80b0, #ffc0cb);
      border-radius: 5px;
    }

    select {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      text-align: center;
      width: 100%;
    }

    .time {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 12px;
      margin-top: 5px;
      color: #ffdce5;
    }
  </style>
</HEAD>

<BODY>
  <canvas id="pinkboard"></canvas>

  <!-- 💖 Ảnh giữa trái tim -->
  <img id="loveImage" src="mylove1.jpg" alt="Heart Image" class="center-image" />

  <!-- 💗 Trình phát nhạc mini -->
  <div class="music-player">
    <select id="musicSelect">
      <option value="music1.mp3">Darling, he lied</option>
      <option value="music2.mp3">Distance</option>
      <option value="music3.mp3">Endlessly</option>
    </select>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

    <div class="controls">
      <button id="prevBtn" class="control-btn"><i class="fas fa-backward"></i></button>
      <button id="playPauseBtn" class="control-btn"><i class="fas fa-play"></i></button>
      <button id="nextBtn" class="control-btn"><i class="fas fa-forward"></i></button>
      <button id="loopBtn" class="control-btn"><i class="fas fa-heart"></i></button>
    </div>


  </div>

  <audio id="bgMusic" src="music1.mp3"></audio>

  <script>
    // 🌸 ẢNH XOAY VÒNG
    const img = document.getElementById("loveImage");
    let current = 1;
    const total = 10;
    setInterval(() => {
      current = current % total + 1;
      img.src = `mylove${current}.jpg`;
    }, 3000);

    // 🎵 TRÌNH PHÁT NHẠC MINI
    const bgMusic = document.getElementById("bgMusic");
    const musicSelect = document.getElementById("musicSelect");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");
    const loopBtn = document.getElementById("loopBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const totalTimeEl = document.getElementById("totalTime");
    const playlist = ["music1.mp3", "music2.mp3", "music3.mp3"];
    let currentIndex = 0;
    let isPlaying = false;
    let loopMode = "all"; // "all" hoặc "one"

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" + s : s}`;
    }

    function loadSong(index) {
      bgMusic.src = playlist[index];
      musicSelect.value = playlist[index];
      bgMusic.load();
      bgMusic.play();
      isPlaying = true;
      playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
    }

    musicSelect.addEventListener("change", (e) => {
      currentIndex = playlist.indexOf(e.target.value);
      loadSong(currentIndex);
    });

    playPauseBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      if(isPlaying){
        bgMusic.play();
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      } else {
        bgMusic.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
      }
    });

    loopBtn.addEventListener("click", () => {
      loopMode = loopMode === "all" ? "one" : "all";
      loopBtn.innerHTML = loopMode === "all" ? '<i class="fas fa-heart"></i>' : '<i class="fas fa-heartbeat"></i>';
    });

    nextBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadSong(currentIndex);
    });

    prevBtn.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadSong(currentIndex);
    });

    bgMusic.addEventListener("timeupdate", () => {
      const progress = (bgMusic.currentTime / bgMusic.duration) * 100;
      progressBar.style.width = `${progress}%`;
      currentTimeEl.textContent = formatTime(bgMusic.currentTime);
      totalTimeEl.textContent = isNaN(bgMusic.duration) ? "0:00" : formatTime(bgMusic.duration);
    });

    bgMusic.addEventListener("ended", () => {
      if (loopMode === "one") {
        bgMusic.currentTime = 0;
        bgMusic.play();
      } else {
        nextBtn.click();
      }
    });

    // Tự động bật nhạc khi người dùng tương tác
    bgMusic.volume = 0.5;
    document.body.addEventListener("click", () => bgMusic.play(), { once: true });
  </script>

  <!-- 💗 Hiệu ứng trái tim -->
  <script>
    var settings = {
      particles: { length: 500, duration: 2, velocity: 100, effect: -0.75, size: 30 }
    };

    (function () {
      var b = 0, c = ["ms", "moz", "webkit", "o"];
      for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
        window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
        window.cancelAnimationFrame = window[c[a] + "CancelAnimationFrame"] || window[c[a] + "CancelRequestAnimationFrame"];
      }
      if (!window.requestAnimationFrame) {
        window.requestAnimationFrame = function (h, e) {
          var d = new Date().getTime(), f = Math.max(0, 16 - (d - b));
          var g = window.setTimeout(function () { h(d + f); }, f);
          b = d + f; return g;
        };
      }
      if (!window.cancelAnimationFrame) {
        window.cancelAnimationFrame = function (d) { clearTimeout(d); };
      }
    })();

    var Point = function (x, y) { this.x = x || 0; this.y = y || 0; };
    Point.prototype.clone = function () { return new Point(this.x, this.y); };
    Point.prototype.length = function (length) {
      if (typeof length == "undefined") return Math.sqrt(this.x * this.x + this.y * this.y);
      this.normalize(); this.x *= length; this.y *= length; return this;
    };
    Point.prototype.normalize = function () {
      var length = this.length(); this.x /= length; this.y /= length; return this;
    };

    var Particle = function () { this.position = new Point(); this.velocity = new Point(); this.acceleration = new Point(); this.age = 0; };
    Particle.prototype.initialize = function (x, y, dx, dy) {
      this.position.x = x; this.position.y = y; this.velocity.x = dx; this.velocity.y = dy;
      this.acceleration.x = dx * settings.particles.effect; this.acceleration.y = dy * settings.particles.effect; this.age = 0;
    };
    Particle.prototype.update = function (deltaTime) {
      this.position.x += this.velocity.x * deltaTime; this.position.y += this.velocity.y * deltaTime;
      this.velocity.x += this.acceleration.x * deltaTime; this.velocity.y += this.acceleration.y * deltaTime; this.age += deltaTime;
    };
    Particle.prototype.draw = function (context, image) {
      function ease(t) { return --t * t * t + 1; }
      var size = image.width * ease(this.age / settings.particles.duration);
      context.globalAlpha = 1 - this.age / settings.particles.duration;
      context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
    };

    var ParticlePool = function (length) {
      var particles = new Array(length);
      for (var i = 0; i < particles.length; i++) particles[i] = new Particle();
      var firstActive = 0, firstFree = 0, duration = settings.particles.duration;

      this.add = function (x, y, dx, dy) {
        particles[firstFree].initialize(x, y, dx, dy);
        firstFree++; if (firstFree == particles.length) firstFree = 0;
        if (firstActive == firstFree) { firstActive++; if (firstActive == particles.length) firstActive = 0; }
      };

      this.update = function (deltaTime) {
        var i; if (firstActive < firstFree) { for (i = firstActive; i < firstFree; i++) particles[i].update(deltaTime); }
        if (firstFree < firstActive) { for (i = firstActive; i < particles.length; i++) particles[i].update(deltaTime); for (i = 0; i < firstFree; i++) particles[i].update(deltaTime); }
        while (particles[firstActive].age >= duration && firstActive != firstFree) { firstActive++; if (firstActive == particles.length) firstActive = 0; }
      };

      this.draw = function (context, image) {
        var i; if (firstActive < firstFree) { for (i = firstActive; i < firstFree; i++) particles[i].draw(context, image); }
        if (firstFree < firstActive) { for (i = firstActive; i < particles.length; i++) particles[i].draw(context, image); for (i = 0; i < firstFree; i++) particles[i].draw(context, image); }
      };
    };

    (function (canvas) {
      var context = canvas.getContext("2d"),
        particles = new ParticlePool(settings.particles.length),
        particleRate = settings.particles.length / settings.particles.duration, time;

      function pointOnHeart(t) {
        return new Point(
          160 * Math.pow(Math.sin(t), 3),
          130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
        );
      }

      var image = (function () {
        var canvas = document.createElement("canvas"), context = canvas.getContext("2d");
        canvas.width = settings.particles.size; canvas.height = settings.particles.size;
        function to(t) {
          var point = pointOnHeart(t);
          point.x = settings.particles.size / 2 + point.x * (settings.particles.size / 350);
          point.y = settings.particles.size / 2 - point.y * (settings.particles.size / 350);
          return point;
        }
        context.beginPath(); var t = -Math.PI; var point = to(t); context.moveTo(point.x, point.y);
        while (t < Math.PI) { t += 0.01; point = to(t); context.lineTo(point.x, point.y); }
        context.closePath(); context.fillStyle = "#ea80b0"; context.fill();
        var image = new Image(); image.src = canvas.toDataURL(); return image;
      })();

      function render() {
        requestAnimationFrame(render);
        var newTime = new Date().getTime() / 1000, deltaTime = newTime - (time || newTime);
        time = newTime; context.clearRect(0, 0, canvas.width, canvas.height);
        var amount = particleRate * deltaTime;
        for (var i = 0; i < amount; i++) {
          var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
          var dir = pos.clone().length(settings.particles.velocity);
          particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
        }
        particles.update(deltaTime); particles.draw(context, image);
      }

      function onResize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.onresize = onResize; setTimeout(function () { onResize(); render(); }, 10);
    })(document.getElementById("pinkboard"));
  </script>
</BODY>

</HTML>
